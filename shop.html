<meta charset="utf-8">
<title>הרשימה שלי</title>
<!-- Both of these are load-bearing for a page that has to stand on its own.
     Without the charset a host that serves no encoding hands the browser
     Latin-1 and every Hebrew word turns to mojibake; without the viewport a
     phone renders it at desktop width and zooms out, which is the opposite
     of what somebody holding a trolley needs. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<!-- Rubik reads warmly in Hebrew and carries a friendly page better than the
     system stack did. It rides in on the one load the page already needs -
     the link has to be opened once, over a network, before anybody is in an
     aisle - and it is declared display=swap behind a full system fallback,
     so a slow or missing font never delays a single word. Ticking items
     still touches the network exactly zero times. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap">
<title>הרשימה בסופר</title>
<style>
/* ---------------------------------------------------------------------
   Everything else is inline, on purpose.

   This page does its work in an aisle, where the signal is bad or gone.
   The one external thing is the typeface above, which loads during the
   same first visit that fetches the page itself and falls back to system
   type if it does not arrive. Nothing after that - ticking, adding,
   saving - touches the network at all.
   --------------------------------------------------------------------- */
:root {
  --paper:     #F7F7F3;
  --card:      #FFFFFF;
  --ink:       #16191A;
  --ink-soft:  #5C6560;
  --ink-done:  #969D98;
  --rule:      #E4E7E2;
  --rule-soft: #F0F1ED;
  --go:        #1E7A4C;
  --go-wash:   #E6F1EA;
  --go-deep:   #145C39;
  --warn:      #9A6209;
  --shadow:    0 1px 2px rgba(20,25,22,.06), 0 10px 24px -16px rgba(20,25,22,.25);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:     #101312;
    --card:      #191D1C;
    --ink:       #E7EAE7;
    --ink-soft:  #A3ABA6;
    --ink-done:  #6B736E;
    --rule:      #2A302D;
    --rule-soft: #232826;
    --go:        #58C08C;
    --go-wash:   #163023;
    --go-deep:   #7FD3A9;
    --warn:      #D6A24E;
    --shadow:    0 1px 2px rgba(0,0,0,.5), 0 10px 24px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"] {
  --paper:     #101312;
  --card:      #191D1C;
  --ink:       #E7EAE7;
  --ink-soft:  #A3ABA6;
  --ink-done:  #6B736E;
  --rule:      #2A302D;
  --rule-soft: #232826;
  --go:        #58C08C;
  --go-wash:   #163023;
  --go-deep:   #7FD3A9;
  --warn:      #D6A24E;
  --shadow:    0 1px 2px rgba(0,0,0,.5), 0 10px 24px -16px rgba(0,0,0,.8);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  direction: rtl;
  font-family: "Rubik", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 17px;
  line-height: 1.5;
  /* Room for the sticky footer, plus the phone's own home indicator. */
  padding-bottom: calc(9rem + env(safe-area-inset-bottom, 0px));
}

.wrap { max-width: 34rem; margin: 0 auto; }

/* ------------------------------------------------------------- header */

header {
  position: sticky;
  top: 0;
  z-index: 5;
  background: var(--paper);
  border-bottom: 1px solid var(--rule);
  padding: .9rem 1rem .75rem;
}

.title-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 1rem;
}

h1 {
  font-size: 1.34rem;
  font-weight: 700;
  margin: 0;
  letter-spacing: -.015em;
  display: flex;
  align-items: center;
  gap: .45rem;
}
.cart { font-size: 1.5rem; line-height: 1; }

.count {
  font-size: .92rem;
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.bar {
  margin-top: .6rem;
  height: 5px;
  border-radius: 3px;
  background: var(--rule);
  overflow: hidden;
}
.bar > i {
  display: block;
  height: 100%;
  width: 0;
  background: var(--go);
  border-radius: 3px;
  transition: width .25s ease;
}
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }

/* -------------------------------------------------------------- rows */

ul { list-style: none; margin: 0; padding: 0; }

li {
  border-bottom: 1px solid var(--rule-soft);
  background: var(--card);
}

/* The whole row is the target: one hand, trolley in the other. */
.row {
  display: flex;
  align-items: center;
  gap: .85rem;
  width: 100%;
  padding: 1.05rem 1rem;
  background: none;
  border: 0;
  font: inherit;
  color: inherit;
  text-align: start;
  cursor: pointer;
  min-height: 60px;
}

.box {
  flex: 0 0 auto;
  width: 27px;
  height: 27px;
  border: 2px solid var(--rule);
  border-radius: 8px;
  display: grid;
  place-items: center;
  background: var(--paper);
}
.box svg { width: 17px; height: 17px; stroke: #fff; display: none; }

/* The emoji does the recognising, so the eye can find "לחם" without
   reading the whole list. Fixed width so every name still starts on the
   same line - a ragged left edge is harder to scan, not easier. */
.pic {
  flex: 0 0 auto;
  width: 1.9rem;
  font-size: 1.35rem;
  line-height: 1;
  text-align: center;
}
.name { flex: 1; font-size: 1.07rem; font-weight: 500; }
.qty {
  flex: 0 0 auto;
  font-size: .86rem;
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
}

li.done .box { background: var(--go); border-color: var(--go); }
li.done .box svg { display: block; }
li.done .name { text-decoration: line-through; color: var(--ink-done); font-weight: 400; }
li.done .pic { opacity: .35; }
li.done .qty { color: var(--ink-done); }

li.added .name::after {
  content: "נוסף כאן";
  font-size: .68rem;
  color: var(--go-deep);
  background: var(--go-wash);
  padding: .1rem .4rem;
  border-radius: 4px;
  margin-inline-start: .5rem;
  vertical-align: 2px;
  text-decoration: none;
  display: inline-block;
}

/* --------------------------------------------------------------- add */

.add {
  display: flex;
  gap: .5rem;
  padding: .9rem 1rem;
  background: var(--card);
  border-bottom: 1px solid var(--rule-soft);
}
.add input {
  flex: 1;
  font: inherit;
  font-size: 1rem;
  padding: .7rem .8rem;
  border: 1.5px solid var(--rule);
  border-radius: 10px;
  background: var(--paper);
  color: var(--ink);
  min-width: 0;
}
.add input::placeholder { color: var(--ink-done); }
.add button {
  flex: 0 0 auto;
  font: inherit;
  font-weight: 600;
  padding: .7rem 1.05rem;
  border: 0;
  border-radius: 10px;
  background: var(--go-wash);
  color: var(--go-deep);
  cursor: pointer;
}

/* ------------------------------------------------------------ footer */

footer {
  position: fixed;
  inset-inline: 0;
  bottom: 0;
  z-index: 6;
  background: var(--card);
  border-top: 1px solid var(--rule);
  padding: .85rem 1rem calc(.85rem + env(safe-area-inset-bottom, 0px));
  box-shadow: var(--shadow);
}
.footer-inner { max-width: 34rem; margin: 0 auto; display: flex; flex-direction: column; gap: .55rem; }

.send {
  width: 100%;
  font: inherit;
  font-size: 1.05rem;
  font-weight: 700;
  padding: 1rem;
  border: 0;
  border-radius: 12px;
  background: var(--go);
  color: #fff;
  cursor: pointer;
}
.send[disabled] { background: var(--rule); color: var(--ink-done); cursor: default; }

.send.second {
  background: var(--go-wash);
  color: var(--go-deep);
  font-size: .97rem;
  padding: .8rem;
}

.hint { font-size: .8rem; color: var(--ink-soft); text-align: center; }

/* --------------------------------------------------------------- misc */

.empty { padding: 3rem 1.5rem; text-align: center; color: var(--ink-soft); }
.empty h2 { font-size: 1.1rem; color: var(--ink); margin: 0 0 .5rem; }
.empty p { margin: 0; font-size: .95rem; }

.toast {
  position: fixed;
  inset-inline: 1rem;
  bottom: calc(8.5rem + env(safe-area-inset-bottom, 0px));
  margin: 0 auto;
  max-width: 22rem;
  background: var(--ink);
  color: var(--paper);
  padding: .75rem 1rem;
  border-radius: 10px;
  text-align: center;
  font-size: .92rem;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s ease;
  z-index: 7;
}
.toast.show { opacity: 1; }

textarea.copy-target {
  position: absolute;
  inset-inline-start: -9999px;
  opacity: 0;
}
</style>

<div class="wrap">
  <header>
    <div class="title-row">
      <h1><span class="cart">🛒</span> הרשימה בסופר</h1>
      <div class="count" id="count"></div>
    </div>
    <div class="bar"><i id="bar"></i></div>
  </header>

  <div id="body"></div>
</div>

<footer id="footer" hidden>
  <div class="footer-inner">
    <button class="send" id="send">שלח לבוט</button>
    <div class="hint" id="hint">הסימון נשמר במכשיר — אפשר לצאת ולחזור</div>
  </div>
</footer>

<div class="toast" id="toast"></div>
<textarea class="copy-target" id="copier" aria-hidden="true" tabindex="-1"></textarea>

<script>
(function () {
  "use strict";

  // The list travels in the part of the URL after the "#".
  //
  // That is the whole privacy design and it is not cosmetic: a fragment is
  // never sent to the server that hosts the page. Whoever ends up hosting
  // this - us, a static host, anyone - never sees a single shopping list.
  // base64url -> the original text, Hebrew included.
  //
  // ⚠️ atob alone is not enough and the bug it causes is silent: it hands
  // back one character per BYTE, so every Hebrew letter - two bytes in UTF-8
  // - arrives as two pieces of mojibake. JSON.parse would still succeed on
  // the punctuation and hand back a list of unreadable names. The escape /
  // decodeURIComponent pair rebuilds the characters, and works in every
  // browser that has ever run this page.
  function fromBase64Url(text) {
    var padded = text.replace(/-/g, "+").replace(/_/g, "/");
    while (padded.length % 4) padded += "=";
    var bytes = atob(padded);
    var percent = "";
    for (var i = 0; i < bytes.length; i++) {
      percent += "%" + ("00" + bytes.charCodeAt(i).toString(16)).slice(-2);
    }
    return decodeURIComponent(percent);
  }

  function readPayload() {
    var raw = (location.hash || "").replace(/^#/, "");
    if (raw) {
      // v2 is base64url; v1 was the JSON percent-encoded, which spent six
      // characters on every Hebrew letter and made a link nine lines long.
      // Both are read, because a v1 link may still be sitting in somebody's
      // chat, open in a tab, or saved to a home screen.
      try {
        return JSON.parse(fromBase64Url(raw));
      } catch (e) {
        try { return JSON.parse(decodeURIComponent(raw)); } catch (e2) { /* on */ }
      }
    }
    // A list baked into the page itself, for the two cases where a fragment
    // cannot arrive: a host that renders the list in server-side, and any
    // viewer that shows this page inside a frame - a frame has its own
    // address, so the "#" stays with the page outside it and never reaches
    // us here. Same shape either way, so nothing below knows the difference.
    var inline = document.getElementById("superlist-data");
    if (inline) {
      try { return JSON.parse(inline.textContent); } catch (e) { return null; }
    }
    return null;
  }

  var payload = readPayload();
  var body = document.getElementById("body");
  var footer = document.getElementById("footer");

  if (!payload || !Array.isArray(payload.items)) {
    body.innerHTML =
      '<div class="empty"><h2>אין כאן רשימה</h2>' +
      "<p>כדי לפתוח את הדף הזה, תכתוב לבוט בוואטסאפ " +
      '<strong>"אני בסופר"</strong> והוא ישלח לך קישור עם הרשימה שלך.</p></div>';
    document.getElementById("count").textContent = "";
    return;
  }

  var listId = payload.id || "default";
  var STORE = "superlist:" + listId;

  // What the shopper has done here, kept on the phone. This is what makes
  // the page survive a screen lock, a stray back button, or the browser
  // deciding to reload it - none of which should cost somebody the ticks
  // they made in the last three aisles.
  var saved = { done: [], added: [] };
  try {
    var fromDisk = JSON.parse(localStorage.getItem(STORE) || "null");
    if (fromDisk && Array.isArray(fromDisk.done)) saved = fromDisk;
  } catch (e) { /* a broken record costs the ticks, never the page */ }

  // Anything the bot already had ticked starts ticked.
  (payload.done || []).forEach(function (name) {
    if (saved.done.indexOf(name) === -1) saved.done.push(name);
  });

  function persist() {
    try { localStorage.setItem(STORE, JSON.stringify(saved)); } catch (e) {}
  }

  function allRows() {
    return payload.items.concat(saved.added.map(function (n) {
      return { n: n, l: n, added: true };
    }));
  }


  // An emoji per line, so the eye finds "לחם" without reading the list.
  //
  // Matched on the text rather than on category names from the bot, which
  // means a thing typed here by hand - "אבטיח" - gets its picture too. The
  // longest match wins, so ביסלי is not answered by the rule for לחם, and
  // anything unmatched simply gets no picture rather than a wrong one.
  var PICTURES = [
    ["גבינה צהובה","🧀"],["גבינה לבנה","🧀"],["גבינת שמנת","🧀"],
    ["גבינה בולגרית","🧀"],["שמנת חמוצה","🥛"],["מעדן חלב","🍮"],
    ["חמאת בוטנים","🥜"],["ממרח שוקולד","🍫"],["עגבניות מרוסקות","🥫"],
    ["רוטב עגבניות","🥫"],["מלפפונים חמוצים","🥒"],["מים מינרליים","💧"],
    ["קפסולות קפה","☕"],["קפה טורקי","☕"],["קפה נמס","☕"],
    ["אבקת כביסה","🧺"],["מרכך כביסה","🧺"],["נוזל כלים","🧼"],
    ["שקיות זבל","🗑️"],["נייר טואלט","🧻"],["מגבות נייר","🧻"],
    ["כלים חד פעמיים","🍽️"],["משחת שיניים","🪥"],["מברשת שיניים","🪥"],
    ["דגני בוקר","🥣"],["תפוח אדמה","🥔"],["חזה עוף","🍗"],
    ["בשר טחון","🥩"],["פילה דג","🐟"],["שמן זית","🫒"],
    ["שמן קנולה","🫗"],["שמן חמניות","🫗"],["שמן שומשום","🫗"],
    ["מיץ לימון","🍋"],["משקה קל","🥤"],["סבון ידיים","🧼"],
    ["סבון גוף","🧼"],["ביסלי","🥨"],["במבה","🥨"],["אפרופו","🥨"],
    ["דוריטוס","🌽"],["חיתולים","👶"],["תחבושות","🩹"],
    ["דאודורנט","🧴"],["אקונומיקה","🧴"],["מגבונים","🧻"],
    ["מטליות","🧽"],["שמפו","🧴"],["סבון","🧼"],
    ["חלב","🥛"],["ביצים","🥚"],["קוטג","🧀"],["גבינה","🧀"],
    ["שמנת","🥛"],["חמאה","🧈"],["יוגורט","🥣"],["לבן","🥛"],["שוקו","🥛"],
    ["לחמניות","🥐"],["לחם","🍞"],["פיתות","🫓"],["פיתה","🫓"],
    ["חלה","🍞"],["בורקס","🥟"],["בצק","🥐"],
    ["עוגיות","🍪"],["עוגה","🍰"],["קרקר","🍘"],["בייגלה","🥨"],
    ["פריכיות","🍘"],["ביסקוויט","🍪"],["וופל","🧇"],
    ["שניצל","🍗"],["עוף","🍗"],["קבב","🍢"],["המבורגר","🍔"],
    ["נקניקיות","🌭"],["פסטרמה","🥓"],["סלמי","🥓"],["בשר","🥩"],
    ["טונה","🐟"],["דג","🐟"],
    ["עגבניות","🍅"],["עגבניה","🍅"],["מלפפון","🥒"],["בצל","🧅"],
    ["גזר","🥕"],["חסה","🥬"],["כרוב","🥬"],["פלפל","🫑"],["שום","🧄"],
    ["לימון","🍋"],["בננה","🍌"],["תפוח","🍎"],["פטריות","🍄"],
    ["אבוקדו","🥑"],["תירס","🌽"],["אפונה","🫛"],["זיתים","🫒"],
    ["אבטיח","🍉"],["מלון","🍈"],["ענבים","🍇"],["תות","🍓"],
    ["אגס","🍐"],["אפרסק","🍑"],["תפוז","🍊"],["רימון","🍎"],
    ["גזוז","🥤"],["סלט","🥗"],
    ["אורז","🍚"],["פסטה","🍝"],["אטריות","🍜"],["קוסקוס","🍚"],
    ["קמח","🌾"],["סוכר","🍬"],["מלח","🧂"],["חומץ","🧴"],
    ["עדשים","🫘"],["שעועית","🫘"],["גרעינים","🌻"],["שקדים","🥜"],
    ["אגוזים","🥜"],["פיצוחים","🥜"],["טחינה","🥣"],["חומוס","🥣"],
    ["מיונז","🥫"],["קטשופ","🥫"],["חרדל","🥫"],["ריבה","🍓"],
    ["מים","💧"],["מיץ","🧃"],["בירה","🍺"],["יין","🍷"],
    ["תה","🍵"],["קפה","☕"],["שוקולד","🍫"],["סוכריות","🍬"],
    ["מסטיק","🍬"],["גלידה","🍦"],["חטיף","🍿"],["שמן","🫗"],
    ["נייר","🧻"],["דבש","🍯"],["פיצה","🍕"],["קרח","🧊"]
  ];

  function pictureFor(text) {
    for (var i = 0; i < PICTURES.length; i++) {
      if (text.indexOf(PICTURES[i][0]) !== -1) return PICTURES[i][1];
    }
    return "";
  }

  var TICK = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3.2" ' +
             'stroke-linecap="round" stroke-linejoin="round">' +
             '<path d="M20 6 9 17l-5-5"/></svg>';

  function render() {
    var rows = allRows();
    var list = document.createElement("ul");

    rows.forEach(function (item) {
      var li = document.createElement("li");
      var isDone = saved.done.indexOf(item.n) !== -1;
      li.className = (isDone ? "done " : "") + (item.added ? "added" : "");

      var btn = document.createElement("button");
      btn.className = "row";
      btn.type = "button";
      btn.setAttribute("aria-pressed", isDone ? "true" : "false");

      var box = document.createElement("span");
      box.className = "box";
      box.innerHTML = TICK;

      var label = item.l || item.n;

      var pic = document.createElement("span");
      pic.className = "pic";
      pic.setAttribute("aria-hidden", "true");
      pic.textContent = pictureFor(label) || pictureFor(item.n);

      var name = document.createElement("span");
      name.className = "name";
      name.textContent = label;

      btn.appendChild(box);
      btn.appendChild(pic);
      btn.appendChild(name);

      // No separate quantity here on purpose: the label the bot sends is
      // already the finished line ("בננה (ק\"ג) × 3"), and rendering the
      // number again beside it printed the quantity twice. One list, shown
      // the same way in both places.

      btn.addEventListener("click", function () {
        var at = saved.done.indexOf(item.n);
        if (at === -1) saved.done.push(item.n);
        else saved.done.splice(at, 1);
        sent.marks = false;      // something changed, so there is more to send
        persist();
        render();
      });

      li.appendChild(btn);
      list.appendChild(li);
    });

    // Adding, because a phone call in aisle four is the normal case:
    // "תקשיב, אני צריכה גם אבטיח".
    var add = document.createElement("form");
    add.className = "add";
    add.innerHTML =
      '<input id="newItem" placeholder="להוסיף מוצר…" ' +
      'autocomplete="off" autocorrect="off" enterkeyhint="done">' +
      "<button type=\"submit\">הוסף</button>";
    add.addEventListener("submit", function (e) {
      e.preventDefault();
      var field = document.getElementById("newItem");
      var value = (field.value || "").trim();
      if (!value) return;
      var seen = allRows().some(function (r) { return r.n === value; });
      if (!seen) { saved.added.push(value); sent.adds = false; }
      field.value = "";
      persist();
      render();
      // Keep the keyboard up: people add two or three things at once.
      var again = document.getElementById("newItem");
      if (again) again.focus();
    });

    body.innerHTML = "";
    body.appendChild(list);
    body.appendChild(add);

    var done = rows.filter(function (r) {
      return saved.done.indexOf(r.n) !== -1;
    }).length;
    document.getElementById("count").textContent = done + " מתוך " + rows.length;
    document.getElementById("bar").style.width =
      (rows.length ? (done / rows.length) * 100 : 0) + "%";

    footer.hidden = false;
    refreshButtons();
  }

  function markedNames() {
    return allRows()
      .filter(function (r) { return saved.done.indexOf(r.n) !== -1 && !r.added; })
      .map(function (r) { return r.n; });
  }

  function addedNames() {
    return saved.added.slice();
  }

  // ---------------------------------------------------------------- steps
  //
  // One button at a time, always.
  //
  // The bot needs two separate instructions - what came off the list, and
  // what should go on to it - and the first version simply put both on
  // screen at once. Two buttons that both said "שלח" is our problem handed
  // to the shopper, who then has to work out which one is theirs. Now the
  // page asks for one thing, and only mentions the second after the first
  // is done - and only if they actually added something, which most trips
  // will not.
  var sent = { marks: false, adds: false };

  function nextStep() {
    var marks = markedNames();
    var adds = addedNames();
    if (marks.length && !sent.marks) return "marks";
    if (adds.length && !sent.adds) return "adds";
    return null;
  }

  function refreshButtons() {
    var send = document.getElementById("send");
    var hint = document.getElementById("hint");
    var step = nextStep();
    var marks = markedNames();
    var adds = addedNames();

    if (step === "marks") {
      send.disabled = false;
      send.textContent = "שלח לבוט את מה שלקחתי";
      hint.textContent = marks.length === 1
        ? "כלומר: " + marks[0]
        : "כלומר: " + marks.join(", ");
      return;
    }
    if (step === "adds") {
      send.disabled = false;
      send.textContent = sent.marks
        ? "ועכשיו — שלח את מה שהוספתי"
        : "שלח לבוט את מה שהוספתי";
      hint.textContent = "כלומר: " + adds.join(", ");
      return;
    }
    send.disabled = true;
    if (sent.marks || sent.adds) {
      send.textContent = "נשלח הכול ✅";
      hint.textContent = "אפשר להמשיך לסמן, והכפתור יחזור";
    } else {
      send.textContent = "עוד לא סימנת כלום";
      hint.textContent = "הסימון נשמר במכשיר — אפשר לצאת ולחזור";
    }
  }

  // Two messages, not one, because they are two different instructions to
  // the bot: what came off the list, and what should go on to it. The bot
  // reads either on its own, so nothing here has to be clever.
  // A machine-shaped prefix on purpose (31.08): the old free-text
  // "קניתי X, Y" re-entered the bot through its human-sentence reader,
  // which re-GUESSED each name - and a line the shopper typed as
  // "קולה זירו" came back as its category. The bot reads this prefix
  // with exact matching and no guessing at all.
  function markMessage() { return "סימנתי בדף: " + markedNames().join(", "); }
  function addMessage() { return "תוסיף " + addedNames().join(", "); }

  function toast(text) {
    var el = document.getElementById("toast");
    el.textContent = text;
    el.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.classList.remove("show"); }, 2400);
  }

  function hand_over(text) {
    // A wa.me link only works once the bot has a number of its own. Until
    // then the honest fallback is the clipboard, which needs no setup and
    // no permission from anybody.
    if (payload.p) {
      location.href = "https://wa.me/" + payload.p + "?text=" + encodeURIComponent(text);
      return;
    }
    var done = false;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        toast("הועתק — תדביק לבוט בוואטסאפ");
      }, function () { fallbackCopy(text); });
      done = true;
    }
    if (!done) fallbackCopy(text);
  }

  function fallbackCopy(text) {
    var box = document.getElementById("copier");
    box.value = text;
    box.select();
    try {
      document.execCommand("copy");
      toast("הועתק — תדביק לבוט בוואטסאפ");
    } catch (e) {
      toast("תעתיק ידנית: " + text);
    }
  }

  document.getElementById("send").addEventListener("click", function () {
    var step = nextStep();
    if (step === "marks") { sent.marks = true; hand_over(markMessage()); }
    else if (step === "adds") { sent.adds = true; hand_over(addMessage()); }
    refreshButtons();
  });

  render();
})();
</script>
